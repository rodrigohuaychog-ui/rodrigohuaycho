<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rodrigo Huaycho — Portafolio</title>
<meta name="description" content="Portafolio digital de Rodrigo Huaycho: comunicador audiovisual, presentador, guionista y editor de video. Disponible en español, inglés y portugués.">
<meta name="theme-color" content="#FDFDFD">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230D0D0D'/%3E%3Ctext x='32' y='43' font-family='Arial Black,Arial' font-weight='900' font-size='28' text-anchor='middle' fill='%23F1EBE1'%3Erh%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ui:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --bg:#FDFDFD;--fg:#0D0D0D;--mut:#6E6E73;--line:#E5E5E7;--soft:#F2F2F4;--blue:#014BAA;--red:#E0243A;--card:#FFFFFF;
  --grad:conic-gradient(from 200deg,#0D0D0D,#014BAA,#7F011F,#EC5E27,#064734,#0D0D0D);
  --lv:0;color-scheme:light;
}
[data-theme=dark]{--bg:#0B0B0A;--fg:#F1EBE1;--mut:#A8A296;--line:#2A2824;--soft:#1B1A17;--blue:#7FA8FF;--card:#141311;color-scheme:dark}
html{font-size:16px}
@media(min-width:900px){html{font-size:clamp(15px,calc(.5vw + 10px),26px)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--ui);background:var(--bg);color:var(--fg);overflow:hidden;-webkit-font-smoothing:antialiased;font-synthesis:none;transition:background-color .3s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:.4rem}
.ic{width:1.75rem;height:1.75rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{font-weight:850;font-stretch:108%;letter-spacing:-.04em;display:inline-block;transform:skewX(-9deg);font-size:1.7rem;line-height:1}

/* ===== LAYOUT ===== */
.app{display:flex;height:100dvh;width:100%}
.col{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1rem;border-bottom:1px solid var(--line);background:var(--bg);z-index:6}
.top .r{display:flex;gap:.9rem;align-items:center}
.top button{padding:.25rem;position:relative}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;display:none;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.view.on{display:block}
.tab{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:.35rem 0 calc(.35rem + env(safe-area-inset-bottom));background:var(--bg);z-index:6}
.tab button{padding:.55rem 1rem;position:relative;color:var(--mut);transition:color .2s,transform .2s var(--spring)}
.tab button.on{color:var(--fg)}
.tab button:active{transform:scale(.88)}
.tab .ic{width:1.8rem;height:1.8rem}
.tab button.on .ic{stroke-width:2.5}
.dotn{position:absolute;top:.35rem;right:.7rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.side,.right{display:none}
.wrap{width:100%;margin:0 auto}

/* ===== STORIES ===== */
.stories{display:flex;gap:.9rem;overflow-x:auto;padding:1rem 1rem .6rem;scrollbar-width:none;scroll-snap-type:x proximity}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;width:5.6rem;text-align:center;scroll-snap-align:start;transition:transform .25s var(--spring)}
.st:active{transform:scale(.92)}
.st .rg{width:5.4rem;height:5.4rem;border-radius:50%;padding:3px;background:var(--grad);display:grid;place-items:center;margin:0 auto;transition:transform .3s var(--spring)}
.st:hover .rg{transform:scale(1.06)}
.st.seen .rg{background:var(--line)}
.st .gl{width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);display:grid;place-items:center;font-weight:850;font-stretch:112%;font-size:1.25rem;letter-spacing:-.04em;overflow:hidden;position:relative}
.st .gl::after{content:"";position:absolute;width:70%;height:70%;border-radius:50%;background:var(--ac);opacity:.28;right:-22%;bottom:-22%}
.st b{display:block;margin-top:.4rem;font-size:.95rem;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== POST ===== */
.feed{padding-bottom:2rem}
.post{border-bottom:1px solid var(--line);padding-bottom:.5rem;margin-bottom:.4rem}
.ph{display:flex;align-items:center;gap:.7rem;padding:.7rem 1rem}
.av{width:2.9rem;height:2.9rem;border-radius:50%;padding:2.5px;background:var(--grad);display:grid;place-items:center;flex:none}
.av.seen{background:var(--line)}
.av i{font-style:normal;width:100%;height:100%;border-radius:50%;border:2.5px solid var(--bg);display:grid;place-items:center;font-weight:850;font-size:.85rem;letter-spacing:-.03em;color:#fff;background:var(--c1)}
.who{min-width:0;flex:1}
.who b{display:flex;align-items:center;gap:.35rem;font-size:1.05rem;font-weight:700}
.who small{display:block;font-size:.92rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.vf{width:1.1rem;height:1.1rem;fill:var(--blue)}
.fbtn{font-weight:700;color:var(--blue);font-size:1rem;padding:.3rem .5rem}
.fbtn.on{color:var(--mut)}
.car{position:relative;aspect-ratio:4/5;background:#000;overflow:hidden;user-select:none}
.trk{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.trk::-webkit-scrollbar{display:none}
.cnt{position:absolute;top:.8rem;right:.8rem;background:rgba(0,0,0,.62);color:#fff;font-weight:700;font-size:.9rem;padding:.25rem .65rem;border-radius:2rem;z-index:5;backdrop-filter:blur(6px)}
.snd{position:absolute;right:.8rem;bottom:.8rem;width:2.5rem;height:2.5rem;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;display:grid;place-items:center;z-index:5;backdrop-filter:blur(6px);transition:transform .2s var(--spring)}
.snd:active{transform:scale(.88)}
.snd .ic{width:1.3rem;height:1.3rem}
.mus{position:absolute;left:.8rem;bottom:.8rem;max-width:calc(100% - 4.8rem);display:flex;align-items:center;gap:.5rem;background:rgba(0,0,0,.62);color:#fff;font-weight:600;font-size:.92rem;padding:.4rem .8rem .4rem .65rem;border-radius:2rem;z-index:5;backdrop-filter:blur(6px);overflow:hidden;white-space:nowrap}
.mus span{overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:.95rem;flex:none}
.eq i{width:3px;background:currentColor;border-radius:2px;height:35%}
.playing .eq i{animation:eq .8s ease-in-out infinite alternate}
.playing .eq i:nth-child(2){animation-delay:-.3s}.playing .eq i:nth-child(3){animation-delay:-.6s}.playing .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{from{height:25%}to{height:100%}}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.9);color:#111;display:none;place-items:center;z-index:5;opacity:0;transition:opacity .2s,transform .2s var(--spring);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ar.l{left:.7rem}.ar.r{right:.7rem}
.ar .ic{width:1.3rem;height:1.3rem;stroke-width:2.6}
@media(hover:hover){.car:hover .ar{opacity:1}.ar{display:grid}.ar:hover{transform:translateY(-50%) scale(1.1)}}
.bh{position:absolute;left:50%;top:50%;width:7rem;height:7rem;margin:-3.5rem;pointer-events:none;z-index:6;color:#fff;opacity:0;filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}
.bh svg{width:100%;height:100%;fill:currentColor;stroke:none}
.bh.go{animation:bh .9s var(--ease)}
@keyframes bh{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.15)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25) translateY(-1.5rem)}}
.acts{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem .2rem;position:relative}
.acts .l{display:flex;gap:1rem;align-items:center}
.acts button{padding:.15rem;transition:transform .2s var(--spring),color .2s}
.acts button:active{transform:scale(.8)}
.acts .ic{width:1.9rem;height:1.9rem}
.like.on{color:var(--red)}.like.on .ic{fill:currentColor;animation:pop .45s var(--spring)}
.save.on .ic{fill:currentColor}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:.3rem;align-items:center}
.dots i{width:.45rem;height:.45rem;border-radius:50%;background:var(--line);transition:all .25s var(--ease)}
.dots i.on{background:var(--blue);transform:scale(1.2)}
.meta{padding:.25rem 1rem .4rem}
.lk{font-weight:500;font-size:1.02rem}.lk b{font-weight:800}
.cap{font-size:1.05rem;line-height:1.4;margin-top:.3rem}
.cap b{font-weight:700}
.cap.cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .tg{color:var(--blue)}
.more{color:var(--mut);font-size:1rem;font-weight:500}
.vc{display:block;color:var(--mut);font-size:1rem;margin-top:.35rem;font-weight:500}
.when{display:block;color:var(--mut);font-size:.85rem;margin-top:.3rem;letter-spacing:.05em;text-transform:uppercase;font-weight:500}

/* ===== SLIDES ===== */
.sl{position:relative;overflow:hidden;background:var(--bg);color:var(--fg);flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;container-type:size;display:flex;font-family:var(--ui)}
.sl .deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.sl .deco::before{content:"";position:absolute;width:86cqmin;height:86cqmin;border-radius:50%;background:var(--tn);right:-30cqmin;bottom:-32cqmin;transition:transform 1.4s var(--ease)}
.sl .deco::after{content:"";position:absolute;width:26cqmin;height:26cqmin;border-radius:50%;border:1.3cqmin solid var(--fg);opacity:.22;left:-9cqmin;top:-9cqmin}
.sl.d1 .deco::before{border-radius:12cqmin;transform:rotate(18deg);right:-34cqmin;bottom:-24cqmin;top:auto}
.sl.d1 .deco::after{border-radius:50%;left:auto;right:9cqmin;top:7cqmin;width:11cqmin;height:11cqmin;background:var(--ac);border:0;opacity:1}
.sl.d2 .deco::before{width:100cqmin;height:100cqmin;right:auto;left:-42cqmin;bottom:-50cqmin;background:repeating-linear-gradient(135deg,var(--tn) 0 3cqmin,transparent 3cqmin 6cqmin);border-radius:50%}
.sl.d2 .deco::after{left:auto;right:-10cqmin;top:-10cqmin;border-radius:3cqmin;transform:rotate(25deg)}
.sl.on .deco::before{transform:scale(1.06) rotate(3deg)}
.sl .in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;padding:9cqmin 8.5cqmin;gap:3.4cqmin;min-width:0}
.a{opacity:0}
.sl.on .a{animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0)*75ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(6cqmin)}to{opacity:1;transform:none}}
.k{font-weight:750;font-size:3.9cqmin;line-height:1.1;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:2cqmin}
.k::before{content:"";width:6cqmin;height:.9cqmin;background:var(--ac);border-radius:1cqmin}
.h1{font-weight:900;font-stretch:112%;letter-spacing:-.05em;line-height:.9;font-size:16cqmin}
.h1.xl{font-size:19cqmin}.h1.l{font-size:15cqmin}.h1.m{font-size:12.5cqmin}.h1.s{font-size:10.2cqmin}
.h2{font-weight:850;font-stretch:108%;letter-spacing:-.04em;line-height:1;font-size:10.5cqmin}
.ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.ln>span{display:block;transform:translateY(110%)}
.sl.on .ln>span{animation:up 1s var(--ease) both;animation-delay:calc(var(--d,0)*75ms + var(--j,0)*100ms + 80ms)}
@keyframes up{to{transform:none}}
.p{font-weight:500;font-size:5.4cqmin;line-height:1.26;letter-spacing:-.01em;max-width:34em}
.p mark{background:none;color:var(--ac);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:2cqmin}
.chips span{font-weight:750;font-size:4.2cqmin;padding:1.7cqmin 3.6cqmin;border-radius:10cqmin;background:var(--fg);color:var(--bg)}
.chips.o span{background:none;border:.5cqmin solid var(--fg);color:var(--fg);font-weight:650}
.handle{font-weight:750;font-size:4.8cqmin;color:var(--ac)}
.num{font-weight:900;font-stretch:112%;letter-spacing:-.06em;line-height:.85;font-size:36cqmin;color:var(--ac)}
.num sup{font-size:.4em;vertical-align:top;letter-spacing:0;margin-left:.04em;line-height:1.5;position:relative;top:.1em}
.sg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3cqmin}
.sg>div{background:var(--tn);border-radius:4cqmin;padding:4cqmin 4.2cqmin}
.sg b{display:block;font-weight:900;font-stretch:110%;font-size:12.5cqmin;letter-spacing:-.05em;line-height:.9;color:var(--ac)}
.sg b sup{font-size:.5em;vertical-align:top;letter-spacing:0}
.sg small{display:block;font-size:4cqmin;font-weight:600;margin-top:1.5cqmin;line-height:1.15;opacity:.92}
.stp{display:flex;flex-direction:column;gap:2.6cqmin}
.stp>div{display:flex;align-items:center;gap:4cqmin;background:var(--tn);border-radius:4cqmin;padding:3.6cqmin 4.2cqmin}
.stp i{font-style:normal;font-weight:900;font-size:7cqmin;color:var(--ac);width:9cqmin;flex:none;letter-spacing:-.04em}
.stp b{display:block;font-weight:800;font-size:5.6cqmin;line-height:1.05;letter-spacing:-.02em}
.stp small{display:block;font-size:4cqmin;font-weight:550;line-height:1.2;margin-top:.8cqmin;opacity:.9}
.bars{display:flex;flex-direction:column;gap:3.4cqmin}
.bars>div b{display:flex;justify-content:space-between;font-weight:800;font-size:5.8cqmin;letter-spacing:-.02em}
.bars>div b em{font-style:normal;font-weight:650;font-size:4.4cqmin;opacity:.85}
.bars .tr{height:3.4cqmin;border-radius:3cqmin;background:var(--tn);margin-top:1.6cqmin;overflow:hidden}
.bars .tr i{display:block;height:100%;width:0;border-radius:3cqmin;background:var(--ac);transition:width 1.4s var(--ease) .3s}
.sl.on .bars .tr i{width:var(--w)}
.chart{height:30cqmin;position:relative;margin:1cqmin 0}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .ar2{fill:var(--tn);opacity:0;transition:opacity 1s .8s}
.sl.on .chart .ar2{opacity:1}
.chart .ln2{fill:none;stroke:var(--ac);stroke-width:1.1cqmin;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;vector-effect:non-scaling-stroke}
.sl.on .chart .ln2{animation:dr 1.6s var(--ease) .3s both}
@keyframes dr{to{stroke-dashoffset:0}}
.cn{font-weight:900;font-size:8cqmin;color:var(--ac);letter-spacing:-.04em}
.tl{background:var(--tn);border-radius:4cqmin;padding:3cqmin;display:flex;flex-direction:column;gap:2cqmin}
.tl .row{display:flex;align-items:center;gap:2cqmin}
.tl .row b{font-size:3.6cqmin;font-weight:800;width:6cqmin;opacity:.8}
.tl .lane{position:relative;flex:1;height:8cqmin;background:color-mix(in srgb,var(--fg) 8%,transparent);border-radius:1.6cqmin;overflow:hidden}
.tl .clip{position:absolute;top:1cqmin;bottom:1cqmin;border-radius:1.2cqmin;background:var(--ac);color:var(--bg);font-weight:800;font-size:3.5cqmin;display:flex;align-items:center;padding:0 1.8cqmin;white-space:nowrap;overflow:hidden;transform:scaleX(0);transform-origin:left}
.tl .clip.al{background:var(--fg)}
.sl.on .tl .clip{animation:grow .9s var(--ease) both;animation-delay:calc(var(--d,0)*100ms + .5s)}
@keyframes grow{to{transform:none}}
.tl .wv{display:flex;align-items:center;gap:.6cqmin;height:100%;padding:0 1cqmin}
.tl .wv i{flex:1;background:var(--ac);border-radius:1cqmin;height:calc(14% + var(--h)*70%);opacity:.85}
.ph2{position:absolute;top:0;bottom:0;left:0;width:.7cqmin;background:var(--fg);z-index:3;border-radius:1cqmin}
.sl.on .ph2{animation:scan 5s linear infinite}
@keyframes scan{from{left:0}to{left:100%}}
.clips{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4cqmin}
.clips div{aspect-ratio:9/12;border-radius:3cqmin;background:var(--tn);display:flex;flex-direction:column;justify-content:flex-end;padding:2.4cqmin;font-weight:850;font-size:5cqmin;position:relative;overflow:hidden;letter-spacing:-.03em}
.clips div::before{content:"";position:absolute;top:2.4cqmin;left:2.4cqmin;width:0;height:0;border-left:3.6cqmin solid var(--ac);border-top:2.2cqmin solid transparent;border-bottom:2.2cqmin solid transparent}
.clips div:nth-child(odd){background:color-mix(in srgb,var(--ac) 30%,var(--bg))}
.books{display:flex;gap:2.6cqmin;align-items:flex-end;height:36cqmin}
.books div{flex:1;border-radius:2cqmin 3cqmin 3cqmin 2cqmin;padding:2.6cqmin;display:flex;flex-direction:column;justify-content:space-between;font-weight:900;font-size:5.6cqmin;line-height:.95;letter-spacing:-.04em;background:var(--ac);color:var(--bg);height:84%;box-shadow:inset 1.4cqmin 0 0 rgba(0,0,0,.18);transform:translateY(6cqmin) rotate(-3deg);opacity:0}
.books div:nth-child(2){height:100%;background:var(--fg);transform:translateY(6cqmin) rotate(0)}
.books div:nth-child(3){transform:translateY(6cqmin) rotate(3deg)}
.sl.on .books div{animation:bk .9s var(--spring) both;animation-delay:calc(var(--d,0)*75ms + .1s + var(--i)*110ms)}
@keyframes bk{to{opacity:1;transform:rotate(var(--r,0deg))}}
.books small{font-size:3cqmin;letter-spacing:.14em;font-weight:700;opacity:.85}
.btn{display:inline-flex;align-items:center;gap:2cqmin;font-weight:800;font-size:4.8cqmin;padding:3cqmin 6cqmin;border-radius:10cqmin;background:var(--ac);color:var(--bg);transition:transform .2s var(--spring);letter-spacing:-.01em;cursor:pointer}
.btn:active{transform:scale(.94)}
.btn.o{background:none;color:var(--fg);border:.6cqmin solid var(--fg)}
.btn.w{background:var(--fg);color:var(--bg)}
.btn .ic{width:5.4cqmin;height:5.4cqmin;stroke-width:2.4}
.btns{display:flex;gap:2.4cqmin;flex-wrap:wrap}
.mail{display:flex;flex-direction:column;align-items:flex-start;gap:2.4cqmin;background:var(--fg);color:var(--bg);border-radius:4cqmin;padding:4cqmin 4.6cqmin;font-weight:800;font-size:4.9cqmin;letter-spacing:-.02em;cursor:pointer;text-align:left}.mail span{overflow-wrap:anywhere}
.mail i{font-style:normal;font-size:3.4cqmin;letter-spacing:.12em;background:var(--ac);color:var(--bg);border-radius:6cqmin;padding:1.2cqmin 2.6cqmin;flex:none}
.rows>div{display:flex;justify-content:space-between;gap:3cqmin;padding:3.2cqmin 0;border-bottom:.5cqmin solid color-mix(in srgb,var(--fg) 22%,transparent);align-items:baseline}
.rows b{font-weight:700;font-size:4cqmin;letter-spacing:.1em;text-transform:uppercase;opacity:.8;flex:none}
.rows span{font-weight:750;font-size:5.2cqmin;text-align:right;line-height:1.15;letter-spacing:-.02em}
.lyr{font-weight:850;font-stretch:106%;font-size:7.6cqmin;line-height:1.08;letter-spacing:-.04em}
.lyr .w{opacity:.18;transition:opacity .4s calc(var(--i)*60ms + .2s),color .4s calc(var(--i)*60ms + .2s)}
.sl.on .lyr .w{opacity:1}
.lyr em{font-style:normal;color:var(--ac)}
.seal{align-self:flex-start;font-weight:850;font-size:3.8cqmin;letter-spacing:.14em;border:.7cqmin solid var(--ac);color:var(--ac);padding:1.4cqmin 2.8cqmin;border-radius:10cqmin;transform:rotate(-3deg)}
.yr{font-weight:900;font-size:11cqmin;letter-spacing:-.05em;line-height:.9;color:var(--ac)}
.h3{font-weight:850;font-size:8.6cqmin;line-height:1.02;letter-spacing:-.04em}
.big0{font-weight:900;font-size:11cqmin;letter-spacing:-.05em;line-height:.95;color:var(--ac)}
.mx{font-size:40cqmin;font-weight:900;position:absolute;right:2cqmin;top:-1cqmin;line-height:.8;letter-spacing:-.08em;color:var(--tn);z-index:-1;font-stretch:112%;opacity:.8}

/* ===== EXPLORE ===== */

.cats button.on{background:var(--fg);color:var(--bg)}
.mos{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;grid-auto-flow:dense;padding:3px 0 2rem}
.tile{position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;background:var(--soft)}
.tile:nth-child(10n+3){grid-column:span 2;grid-row:span 2}
.tile .sl{position:absolute;inset:0;flex:none;transition:transform .5s var(--ease)}

.tile .ov{position:absolute;inset:0;background:rgba(0,0,0,.52);color:#fff;display:flex;align-items:flex-end;padding:.8rem;font-weight:750;font-size:1rem;line-height:1.1;opacity:0;transition:opacity .25s;z-index:3}

.empty{text-align:center;padding:4rem 1.5rem;color:var(--mut);font-size:1.15rem;line-height:1.4}
.empty b{display:block;color:var(--fg);font-size:1.5rem;margin-bottom:.4rem}

/* ===== REELS ===== */

.rw{position:relative;width:100%;height:100%}
.rbox{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.rbox .sl{position:absolute;inset:0;flex:none}
.rgd{position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(transparent,rgba(0,0,0,.86));z-index:3;pointer-events:none}
.rcap{position:absolute;left:1rem;right:5.5rem;bottom:1.3rem;z-index:4;color:#fff;font-size:1.05rem;line-height:1.35}
.rcap .h{display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem}
.rcap .h b{font-size:1.1rem}
.rcap .fb{border:1.5px solid #fff;border-radius:.5rem;padding:.2rem .7rem;font-weight:700;font-size:.95rem}
.rcap .fb.on{background:#fff;color:#000}
.rcap p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.rcap .m{display:flex;align-items:center;gap:.5rem;margin-top:.6rem;font-weight:650;font-size:.95rem}
.rail{position:absolute;right:.2rem;bottom:1.3rem;z-index:5;display:flex;flex-direction:column;gap:1.2rem;align-items:center;color:#fff}
.rail button{width:4.4rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;font-weight:650;font-size:.9rem;transition:transform .2s var(--spring)}
.rail button:active{transform:scale(.85)}
.rail .ic{width:2.1rem;height:2.1rem;filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.rail .like.on{color:var(--red)}.rail .like.on .ic{fill:currentColor}
.rail .save.on .ic{fill:currentColor}
.rail .disc{color:#fff;width:2.6rem;height:2.6rem;border-radius:.6rem;background:var(--c1);border:2px solid #fff;display:grid;place-items:center}
.rail .disc .ic{width:1.3rem;height:1.3rem;filter:none}
.playing .rail .disc{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rtop{position:absolute;top:.9rem;left:1rem;right:1rem;z-index:5;display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:1.4rem;text-shadow:0 1px 6px rgba(0,0,0,.4)}

/* ===== PROFILE ===== */
.pf{padding:1.2rem 1rem 0}
.pt{display:flex;align-items:center;gap:1rem}

.pst>div{flex:1;min-width:0}.pst small{font-size:.9rem;color:var(--mut);font-weight:500;white-space:nowrap}
.bio{margin-top:1rem;font-size:1.05rem;line-height:1.4}

.bio .g{color:var(--mut)}
.pb{display:flex;gap:.5rem;margin-top:1rem}
.pb button{flex:1;padding:.7rem .5rem;border-radius:.7rem;background:var(--soft);font-weight:700;font-size:1.02rem;text-align:center;transition:transform .2s var(--spring)}

.hl{display:flex;gap:1.1rem;overflow-x:auto;padding:1.3rem 0 .4rem;scrollbar-width:none}

.ptabs .ic{width:1.6rem;height:1.6rem}

/* ===== ACTIVITY ===== */
.vh{padding:1.2rem 1rem .6rem;font-size:1.6rem;font-weight:800;letter-spacing:-.03em}
.vs{padding:.9rem 1rem .4rem;font-weight:700;font-size:1.1rem}

.act .ai{width:3.1rem;height:3.1rem;border-radius:50%;background:var(--c1);color:var(--c2);display:grid;place-items:center;flex:none}
.act .ai .ic{width:1.5rem;height:1.5rem}

/* ===== DM ===== */
.dm{display:flex;flex-direction:column;height:100%}

.msg{max-width:84%;padding:.75rem 1.05rem;border-radius:1.4rem;font-size:1.08rem;line-height:1.35;animation:rise2 .45s var(--ease) both;word-break:break-word}
.msg.in{background:var(--soft);align-self:flex-start;border-bottom-left-radius:.4rem}
.msg.out{background:linear-gradient(135deg,#7a3cff,#c13584 60%,#f77737);color:#fff;align-self:flex-end;border-bottom-right-radius:.4rem}
.msg .cb{display:inline-block;margin-top:.5rem;background:var(--blue);color:#fff;padding:.45rem .9rem;border-radius:2rem;font-weight:700;font-size:.98rem}
@keyframes rise2{from{opacity:0;transform:translateY(.8rem) scale(.96)}to{opacity:1;transform:none}}
.qr{display:flex;gap:.5rem;flex-wrap:wrap;padding:.3rem 1rem .6rem}
.qr button{padding:.6rem 1.05rem;border-radius:2rem;border:1.5px solid var(--blue);color:var(--blue);font-weight:650;font-size:1rem;transition:all .2s}
.qr button:hover{background:var(--blue);color:#fff}
.cmp{display:flex;align-items:center;gap:.7rem;margin:.5rem 1rem 1rem;border:1.5px solid var(--line);border-radius:2rem;padding:.35rem .5rem .35rem 1.1rem}
.cmp input{flex:1;border:0;background:none;color:var(--fg);font:inherit;font-size:1.1rem;outline:0;min-width:0;padding:.45rem 0}
.cmp button{color:var(--blue);font-weight:800;font-size:1.05rem;padding:.5rem .9rem}
.cmp button[disabled]{opacity:.4}

/* ===== MODAL / SHEET ===== */
#modal,#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal.on,#sheet.on{display:flex;animation:fi .25s}

.sh button.o{display:flex;align-items:center;gap:1rem;width:100%;padding:.9rem .5rem;font-size:1.12rem;font-weight:600;border-radius:.8rem}
.sh button.o:hover{background:var(--soft)}
.sh button.o .ic{width:1.7rem;height:1.7rem}
@media(min-width:900px){
 #sheet{align-items:center}.sh{border-radius:1.2rem;align-self:center}
}

  if(!entered)return;

  curTrack=id;if(!id||muted||hidden||vidSl||view==='reels'&&!sv.open&&modalI<0){if(id&&audios[id]&&!audios[id].paused){var a0=audios[id];fade(a0,0,400,function(){a0.pause()})}return}

}

function rgS(rg){if(!rg._s){rg._s={a:0,tg:0,n:+rg.dataset.n,st:+rg.dataset.st,fr:-1,set:0,user:0,drag:null,mv:0};rgBind(rg)}return rg._s}
function rgRel(s,q){var r=(q*s.st-s.a)%360;if(r>180)r-=360;if(r<-180)r+=360;return r}
function rgBind(rg){var s=rg._s;
  rg.addEventListener('pointerdown',function(e){if(e.target.closest('.rg-b'))return;s.drag={x:e.clientX,a:s.a,w:rg.clientWidth};s.mv=0;s.user=performance.now()});
  rg.addEventListener('pointermove',function(e){if(!s.drag)return;var dx=e.clientX-s.drag.x;if(Math.abs(dx)>6){s.mv=1;try{rg.setPointerCapture(e.pointerId)}catch(_){}}if(s.mv){s.a=s.drag.a-dx/s.drag.w*150;s.tg=s.a;rgCap(rg,-1)}});
  function up(){if(!s.drag)return;s.drag=null;s.tg=Math.round(s.a/s.st)*s.st;s.user=performance.now()}
  rg.addEventListener('pointerup',up);rg.addEventListener('pointercancel',up);
  rg.addEventListener('click',function(e){e.stopPropagation();var b=e.target.closest('.rg-b');s.user=performance.now();
    if(b){s.tg=Math.round(s.tg/s.st)*s.st+(b.classList.contains('n')?s.st:-s.st);sfx('swipe');return}
    var c=e.target.closest('.rc');if(!c)return;if(s.mv){e.preventDefault();s.mv=0;return}
    var r=rgRel(s,+c.dataset.q);if(Math.abs(r)>s.st/2){e.preventDefault();s.tg=s.a+r;sfx('swipe')}});
}
function rgCap(rg,q){var s=rg._s,cap=rg.parentNode.querySelector('.rg-cap');if(!cap||s.fr===q)return;s.fr=q;
  if(q<0){cap.classList.remove('show');return}
  var c=rg.querySelectorAll('.rc')[q];cap.querySelector('.rg-y').textContent=c.dataset.y;cap.querySelector('.rg-y').style.display=c.dataset.y?'':'none';
  cap.querySelector('.rg-t').innerHTML=c.dataset.t.split(' ').map(function(w,i){return '<span style="animation-delay:'+(i*55)+'ms">'+w+'</span>'}).join(' ');
  cap.classList.remove('show');void cap.offsetWidth;cap.classList.add('show')}
function rgTick(now){$$('.sl.on .rgx').forEach(function(rg){var s=rgS(rg);
  if(!s.drag){var d=s.tg-s.a;if(Math.abs(d)>.05){if(s.set||s.fr>-1)rgCap(rg,-1);s.a+=d*(RM?1:.075);s.set=0}else{s.a=s.tg;if(!s.set){s.set=now;var q=((Math.round(s.a/s.st)%s.n)+s.n)%s.n;rgCap(rg,q)}else if(now-s.set>3600&&now-s.user>6000){s.tg+=s.st}}}
  if(s._la!==s.a){s._la=s.a;rg.firstChild.style.transform='translateZ(calc(var(--R) * -1)) rotateY('+(-s.a)+'deg)';
    rg.querySelectorAll('.rc').forEach(function(c){var r=rgRel(s,+c.dataset.q),co=Math.cos(r*Math.PI/180);c.style.opacity=co<0?0:(.25+.75*co).toFixed(3);c.classList.toggle('fr',Math.abs(r)<s.st/2);c.style.pointerEvents=co<0?'none':''})}});
  requestAnimationFrame(rgTick)}
requestAnimationFrame(rgTick);
